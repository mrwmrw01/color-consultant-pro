# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Creates the web app (built from Dockerfile), a disk for photos and a
# PostgreSQL database. On first deploy the app migrates and seeds the database
# and creates the admin login from ADMIN_EMAIL / ADMIN_PASSWORD, which Render
# asks for when the Blueprint is created. See DEPLOY.md.

services:
  - type: web
    name: color-consultant-pro
    runtime: docker
    plan: starter # disks need a paid instance
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: photos
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: color-consultant-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Sign-in works on both the onrender.com address and the custom domain
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"
      - key: FEATURE_AI_SUGGESTIONS
        value: "false"

databases:
  - name: color-consultant-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: color_consultant
    user: color_consultant
    ipAllowList: [] # only the app, over Render's private network
